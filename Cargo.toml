[workspace]
resolver = "3"
members = [
    "crates/thadam-core",
    "crates/thadam-store",
    "crates/thadam-collector",
    "crates/thadam-hook",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thadam-core = { path = "crates/thadam-core" }
thadam-store = { path = "crates/thadam-store" }
getrandom = "0.4.3"
libc = "0.2.191"
garde = { version = "0.23.0", default-features = false, features = ["derive"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["std"] }
uuid = { version = "1.29.2", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
