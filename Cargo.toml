[workspace]
resolver = "3"
members = ["crates/thadam-core", "crates/thadam-store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thadam-core = { path = "crates/thadam-core" }
garde = { version = "0.23.0", default-features = false, features = ["derive"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["std"] }
uuid = { version = "1.29.2", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
